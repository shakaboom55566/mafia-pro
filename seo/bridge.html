<script>
/* v40 — Mafia Pro moved to __NEW__. Every old address opens the same place there. The app's own address (the root) also carries
   the player's saved data from this address's storage to the new one (#…&mpm=…, read by seo/app-migrate.js there). */
(function () {
  var NEW = '__NEW__';
  var path = location.pathname.replace(/^\/mafia-pro(\/|$)/, '/');
  var q = location.search.replace(/^\?/, '').split('&').filter(function (x) { return x && x.indexOf('mpback=') !== 0; });
  var search = q.length ? '?' + q.join('&') : '';
  var hash = location.hash && location.hash !== '#' ? location.hash : '';
  if (path === '/' || path === '/index.html') {
    var v = 'none';
    try {
      var s = localStorage.getItem('mafiapro.v1');
      if (s) {
        if (s.length > 1500000) { try { var o = JSON.parse(s); delete o.game; s = JSON.stringify(o); } catch (e) {} }
        v = btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
    } catch (e) {}
    location.replace(NEW + search + (hash ? hash + '&' : '#') + 'mpm=' + v);
  } else {
    location.replace(NEW + path.replace(/^\//, '') + search + hash);
  }
})();
</script>
__REFRESH__
</head>
<body><p>Mafia Pro → <a href="__TARGET__">mafiapro.app</a></p></body>
