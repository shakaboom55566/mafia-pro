name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend URL (overrides the MAFIA_API_URL variable)
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build single-file app
        run: bash build.sh

      - name: Smoke test (engine + every screen in 5 languages)
        run: |
          node test/sim.js
          for lang in ru uk en pl hy; do LANG_CODE=$lang node test/ui-smoke.js; done

      - name: Prepare site (inject backend address from the MAFIA_API_URL repository variable)
        env:
          MAFIA_API_URL: ${{ inputs.api_url || vars.MAFIA_API_URL }}
        run: |
          mkdir -p _site
          # address of the backend: workflow input → repository variable → .mafia-api-url committed by the backend deploy
          [ -n "$MAFIA_API_URL" ] || MAFIA_API_URL=$(cat .mafia-api-url 2>/dev/null | tr -d '[:space:]')
          echo "backend: ${MAFIA_API_URL:-<none>}"
          sed "s#__MAFIA_API__#${MAFIA_API_URL}#" index.html > _site/index.html
          cp 404.html _site/
          touch _site/.nojekyll
          grep -o '<meta name="mafia-api" content="[^"]*">' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Note the build on the commit (which backend address went into the page)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          META=$(grep -o '<meta name="mafia-api" content="[^"]*">' _site/index.html || echo '(no meta)')
          jq -n --arg body "**Deploy to GitHub Pages** run $GITHUB_RUN_NUMBER — **${{ job.status }}** · ${{ steps.deployment.outputs.page_url }}"$'\n\n'"\`$META\`" '{body: $body}' > /tmp/c.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --method POST --input /tmp/c.json > /dev/null && echo "noted"
