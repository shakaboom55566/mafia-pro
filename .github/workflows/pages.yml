name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend URL (overrides the MAFIA_API_URL variable)
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build single-file app
        run: bash build.sh

      - name: Smoke test (engine + every screen in 5 languages)
        run: |
          node test/sim.js
          for lang in ru uk en pl hy; do LANG_CODE=$lang node test/ui-smoke.js; done
          node seo/test-site.mjs

      - name: Prepare site (inject backend address from the MAFIA_API_URL repository variable)
        env:
          MAFIA_API_URL: ${{ inputs.api_url || vars.MAFIA_API_URL }}
        run: |
          mkdir -p _site
          # address of the backend: workflow input → repository variable → .mafia-api-url committed by the backend deploy
          [ -n "$MAFIA_API_URL" ] || MAFIA_API_URL=$(cat .mafia-api-url 2>/dev/null | tr -d '[:space:]')
          echo "backend: ${MAFIA_API_URL:-<none>}"
          sed "s#__MAFIA_API__#${MAFIA_API_URL}#" index.html > _site/index.html
          # search-engine ownership tags (v38): seo/verify.txt — lines "google=<code>" / "bing=<code>" from Search Console / Bing Webmaster
          G=$(sed -n 's/^google=//p' seo/verify.txt 2>/dev/null | tr -d '[:space:]'); B=$(sed -n 's/^bing=//p' seo/verify.txt 2>/dev/null | tr -d '[:space:]')
          V=""; [ -n "$G" ] && V="$V<meta name=\"google-site-verification\" content=\"$G\">"; [ -n "$B" ] && V="$V<meta name=\"msvalidate.01\" content=\"$B\">"
          [ -n "$V" ] && sed -i "s#<!--GSC_VERIFY-->#$V#" _site/index.html && echo "verification tags: ${G:+google }${B:+bing}"
          cp 404.html _site/
          touch _site/.nojekyll
          grep -o '<meta name="mafia-api" content="[^"]*">' _site/index.html

      - name: Node (card images)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Role card images for the Discord library (_site/cards/<lang>/<role>.png)
        continue-on-error: true
        run: |
          set -eo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0 2>&1 | tail -1
          npx playwright install --with-deps chromium 2>&1 | tail -1
          for l in ru uk en pl hy; do node discord/render-cards.js _site/cards/$l mafia-pro.html $l; done
          cp _site/cards/ru/*.png _site/cards/  # v33 addresses (cards/<role>.png) keep working
          du -sh _site/cards

      - name: Public website for search engines (<lang>/, roles, rules, setups, sitemap.xml)
        run: |
          GSC_VERIFY=$(sed -n 's/^google=//p' seo/verify.txt 2>/dev/null | tr -d '[:space:]') node seo/build-site.mjs _site

      - name: Website pictures (card thumbnails, link previews)
        continue-on-error: true
        run: node seo/render-images.js _site && du -sh _site/og

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Note the build on the commit (which backend address went into the page)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          META=$(grep -o '<meta name="mafia-api" content="[^"]*">' _site/index.html || echo '(no meta)')
          jq -n --arg body "**Deploy to GitHub Pages** run $GITHUB_RUN_NUMBER — **${{ job.status }}** · ${{ steps.deployment.outputs.page_url }}"$'\n\n'"\`$META\`" '{body: $body}' > /tmp/c.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --method POST --input /tmp/c.json > /dev/null && echo "noted"
