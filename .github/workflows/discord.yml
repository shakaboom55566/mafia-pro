name: Discord server setup

# Sets up the Mafia Pro Discord server through the bot (discord/setup.mjs): roles, categories, read-only info / library
# channels, the card library and scenarios from the app's own data, server rules, webhooks for #ищу-игру / #результаты / #новости,
# the category for the tables' voice rooms. Idempotent — re-run any time (Actions → "Discord server setup" → Run workflow).
# Secrets: DISCORD_BOT_TOKEN, DISCORD_GUILD_ID (or the id in backend/wrangler.toml); BOT_TOKEN (for the Telegram bot's @username).
on:
  push:
    branches: [main]
    paths: ['discord/**', '.github/workflows/discord.yml', 'src/02*.js']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: discord
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      APP_URL: https://mafiapro.app/
      LOG_FILE: /tmp/discord-setup.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (fake Discord)
        run: |
          set -o pipefail
          node --no-warnings discord/test-setup.mjs | tail -4

      - name: Check secrets
        id: check
        run: |
          G=$(printf '%s' "$DISCORD_GUILD_ID" | tr -cd '0-9'); [ -z "$G" ] && G=$(grep -o '^DISCORD_GUILD_ID = "[0-9]*"' backend/wrangler.toml | tr -cd '0-9')
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$G" ]; then echo "::warning::Нужны секреты DISCORD_BOT_TOKEN и DISCORD_GUILD_ID"; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; echo "DISCORD_GUILD_ID=$G" >> "$GITHUB_ENV"; fi

      - name: Set up the server
        if: steps.check.outputs.ready == 'true'
        run: node --no-warnings discord/setup.mjs

      - name: Save the ids, point the tables' voice rooms to the category
        if: steps.check.outputs.ready == 'true'
        id: save
        run: |
          set -eo pipefail
          CAT=$(node -e 'console.log(require("./discord/server.json").tablesCategory || "")')
          [ -n "$CAT" ] && sed -i "s/^DISCORD_CATEGORY_ID = \".*\"/DISCORD_CATEGORY_ID = \"$CAT\"/" backend/wrangler.toml
          PK=$(node -e 'console.log(require("./discord/server.json").publicKey || "")' | tr -cd '0-9a-f')
          [ -n "$PK" ] && sed -i "s/^DISCORD_PUBLIC_KEY = \".*\"/DISCORD_PUBLIC_KEY = \"$PK\"/" backend/wrangler.toml
          git add discord/server.json backend/wrangler.toml
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git diff --cached --quiet backend/wrangler.toml || echo "redeploy=true" >> "$GITHUB_OUTPUT"
          git config user.name "mafia-pro-deploy"; git config user.email "deploy@users.noreply.github.com"
          git commit -m "chore: Discord server ids (tables category $CAT)"
          git fetch origin main && git rebase origin/main && git push origin HEAD:main

      - name: Redeploy the backend with the tables category
        if: steps.save.outputs.redeploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backend.yml --repo "$GITHUB_REPOSITORY" && echo "backend redeploy triggered" | tee -a "$LOG_FILE"

      - name: Post the log as a commit comment
        if: always() && steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node -e '
            const fs = require("fs"); let s = ""; try { s = fs.readFileSync(process.env.LOG_FILE, "utf8"); } catch (e) { s = "(no log)"; }
            for (const k of ["DISCORD_BOT_TOKEN", "BOT_TOKEN"]) { const v = process.env[k]; if (v && v.length > 3) s = s.split(v).join("<" + k + ">"); }
            if (s.length > 12000) s = s.slice(0, 4000) + "\n…\n" + s.slice(-8000);
            const body = "**Discord server setup** run " + process.env.GITHUB_RUN_NUMBER + " — **" + process.env.JOB_STATUS + "**\n\n```\n" + s + "\n```";
            fs.writeFileSync(process.env.RUNNER_TEMP + "/comment.json", JSON.stringify({ body }));
          '
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --method POST --input "$RUNNER_TEMP/comment.json" > /dev/null && echo "log posted"
