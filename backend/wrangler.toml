# Mafia Pro backend — Cloudflare Worker + D1.
# Secrets (set by the deploy workflow, never committed): BOT_TOKEN, WEBHOOK_SECRET, DISCORD_BOT_TOKEN (optional).
name = "mafia-pro-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
APP_URL = "https://mafiapro.app/"
ALLOWED_ORIGIN = "https://mafiapro.app,https://shakaboom55566.github.io"
# Prices in Telegram Stars (≈ $2 / $9.99 / $35 for buyers)
STARS_ROLE = "100"
STARS_SCENARIO = "500"
STARS_PACK = "1750"
# Telegram ids that may grant full access (/grant in the bot or the admin panel in the app); comma-separated
ADMIN_IDS = "6462266188"
# Telegram @username shown to partners for payout requests (empty = the bot itself; partners' messages to the bot are forwarded to admins)
SUPPORT_USERNAME = ""
# Discord voice rooms for online tables: server (guild) id and, optionally, the category for the rooms.
# The bot token is the GitHub secret DISCORD_BOT_TOKEN; ids may also come from GitHub secrets DISCORD_GUILD_ID / DISCORD_CATEGORY_ID.
# Empty guild id or no token = the "Play with Discord" switch is hidden in the app.
DISCORD_GUILD_ID = ""
DISCORD_CATEGORY_ID = "1559482164825952332"
# public key of the Discord application (not a secret): verifies slash-command requests at /discord/interactions; discord/setup.mjs keeps it in sync
DISCORD_PUBLIC_KEY = "0043fbf602abd13573ec140afe6ed1e9cc5978c4806e18f5068f42a951faff76"
# Telegram channel for daily posts (the bot must be its admin with "Post messages"); drafts go to ADMIN_IDS for approval
CHANNEL_ID = "@mafiaprof"
# players' chat for the /broadcast invitation and its "💬 Чат" button
CHAT_URL = "https://t.me/+3kRZICcUMyBjZDdi"

[[d1_databases]]
binding = "DB"
database_name = "mafia-pro"
database_id = "__D1_DATABASE_ID__"   # replaced by the deploy workflow; any value works for local dev

# every 5 minutes: approved channel posts whose time has come are published; every minute: Discord members (joins / leaves analytics)
[triggers]
crons = ["*/5 * * * *", "* * * * *"]

[observability]
enabled = true
